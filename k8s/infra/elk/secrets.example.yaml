apiVersion: v1
kind: Secret
metadata:
  name: elk-credentials
  namespace: infra
type: Opaque
stringData:
  # 최소 12자 이상의 서로 다른 난수로 교체하고 이 파일은 Git에 커밋하지 않습니다.
  elastic-password: REPLACE_WITH_ELASTIC_ADMIN_PASSWORD
  kibana-system-password: REPLACE_WITH_KIBANA_SYSTEM_PASSWORD
  logstash-password: REPLACE_WITH_LOGSTASH_WRITER_PASSWORD
