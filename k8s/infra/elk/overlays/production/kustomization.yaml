apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - elasticsearch-pdb.yaml
patches:
  - path: elasticsearch-production.yaml
    target:
      kind: StatefulSet
      name: elasticsearch
  # openebs-hostpath는 노드 고정 RWO 볼륨이므로 운영 클러스터의 StorageClass로 바꿉니다.
  - target:
      kind: StatefulSet
      name: elasticsearch
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: REPLACE_MULTI_NODE_STORAGE_CLASS
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 200Gi
