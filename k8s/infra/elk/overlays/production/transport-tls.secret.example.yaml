# 실제 인증서 파일은 커밋하지 마십시오.
# README의 kubectl create secret 명령으로 elasticsearch-transport-tls Secret을 생성합니다.
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-transport-tls
  namespace: infra
type: Opaque
stringData:
  ca.crt: REPLACE_WITH_CLUSTER_CA_CERTIFICATE_PEM
  tls.crt: REPLACE_WITH_NODE_CERTIFICATE_PEM
  tls.key: REPLACE_WITH_NODE_PRIVATE_KEY_PEM
