apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-settings
  namespace: infra
data:
  logstash.yml: |
    config.reload.automatic: true
    config.reload.interval: 5s
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: infra
  labels:
    app.kubernetes.io/name: logstash
spec:
  selector:
    app.kubernetes.io/name: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: beats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
    spec:
      initContainers:
        - name: wait-for-credentials
          image: curlimages/curl:8.12.1
          env:
            - name: LOGSTASH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: logstash-password
          command: ["sh", "-ec", "until curl --fail --silent -u logstash_internal:${LOGSTASH_PASSWORD} http://elasticsearch.infra.svc:9200/_cluster/health >/dev/null; do sleep 5; done"]
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.19.17
          env:
            - name: LOGSTASH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: logstash-password
          ports:
            - name: beats
              containerPort: 5044
          readinessProbe:
            tcpSocket:
              port: beats
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: settings
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: logstash-settings
        - name: pipeline
          configMap:
            name: logstash-pipeline
