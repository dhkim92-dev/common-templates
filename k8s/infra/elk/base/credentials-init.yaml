apiVersion: batch/v1
kind: Job
metadata:
  name: elk-credentials-init
  namespace: infra
  labels:
    app.kubernetes.io/name: elk-credentials-init
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elk-credentials-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initialize
          image: curlimages/curl:8.12.1
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: elastic-password
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: kibana-system-password
            - name: LOGSTASH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: logstash-password
          command:
            - sh
            - -ec
            - |
              until curl --fail --silent --show-error -u "elastic:${ELASTIC_PASSWORD}" http://elasticsearch.infra.svc:9200/_cluster/health >/dev/null; do sleep 5; done
              curl --fail --silent --show-error -u "elastic:${ELASTIC_PASSWORD}" -X POST http://elasticsearch.infra.svc:9200/_security/user/kibana_system/_password -H 'Content-Type: application/json' -d "{\"password\":\"${KIBANA_PASSWORD}\"}"
              curl --fail --silent --show-error -u "elastic:${ELASTIC_PASSWORD}" -X PUT http://elasticsearch.infra.svc:9200/_security/role/logstash_writer -H 'Content-Type: application/json' -d '{"cluster":["monitor","manage_index_templates"],"indices":[{"names":["logs-*"],"privileges":["auto_configure","create_index","write","view_index_metadata"]}]}'
              curl --fail --silent --show-error -u "elastic:${ELASTIC_PASSWORD}" -X PUT http://elasticsearch.infra.svc:9200/_security/user/logstash_internal -H 'Content-Type: application/json' -d "{\"password\":\"${LOGSTASH_PASSWORD}\",\"roles\":[\"logstash_writer\"]}"
