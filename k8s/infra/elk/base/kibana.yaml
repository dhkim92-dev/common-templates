apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: infra
  labels:
    app.kubernetes.io/name: kibana
spec:
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: web
      port: 5601
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
    spec:
      initContainers:
        - name: wait-for-credentials
          image: curlimages/curl:8.12.1
          env:
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: kibana-system-password
          command: ["sh", "-ec", "until curl --fail --silent -u kibana_system:${KIBANA_PASSWORD} http://elasticsearch.infra.svc:9200/_cluster/health >/dev/null; do sleep 5; done"]
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.17
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch.infra.svc:9200"]'
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: kibana-system-password
          ports:
            - name: web
              containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: web
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
