# This file is intentionally excluded from kustomization.yaml.
# Copy it to secrets.yaml, replace every value, then apply it before PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: infra
type: Opaque
stringData:
  POSTGRES_DB: grafana
  POSTGRES_USER: grafana
  POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD
