apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: infra
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
    - name: cluster-tcp
      port: 9094
      targetPort: cluster-tcp
    - name: cluster-udp
      port: 9094
      protocol: UDP
      targetPort: cluster-udp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager
  namespace: infra
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: infra
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: [alertname, cluster, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: '#alerts'
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\\n" }}{{ end }}'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: infra
spec:
  serviceName: alertmanager
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=0.0.0.0:9094
            - --cluster.peer=alertmanager-0.alertmanager.infra.svc:9094
            - --cluster.peer=alertmanager-1.alertmanager.infra.svc:9094
            - --cluster.peer=alertmanager-2.alertmanager.infra.svc:9094
          ports:
            - name: web
              containerPort: 9093
            - name: cluster-tcp
              containerPort: 9094
            - name: cluster-udp
              containerPort: 9094
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: slack
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: slack
          secret:
            secretName: alertmanager-slack
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 10Gi
