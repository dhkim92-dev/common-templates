apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
  labels:
    app.kubernetes.io/name: grafana
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-web
  namespace: infra
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: infra
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.infra.svc:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: infra
spec:
  serviceName: grafana
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - name: web
              containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-database
            - secretRef:
                name: grafana-admin
          env:
            - name: GF_SERVER_ROOT_URL
              value: http://grafana-web.infra.svc:3000/
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
            - name: GF_UNIFIED_ALERTING_HA_LISTEN_ADDRESS
              value: $(POD_IP):9094
            - name: GF_UNIFIED_ALERTING_HA_PEERS
              value: grafana-0.grafana.infra.svc:9094,grafana-1.grafana.infra.svc:9094
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
