# This file is intentionally excluded from kustomization.yaml.
# Copy it to secrets.yaml, replace every value, then apply it before Grafana.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-database
  namespace: infra
type: Opaque
stringData:
  GF_DATABASE_TYPE: postgres
  GF_DATABASE_HOST: REPLACE_POSTGRES_HOST:5432
  GF_DATABASE_NAME: grafana
  GF_DATABASE_USER: grafana
  GF_DATABASE_PASSWORD: REPLACE_DATABASE_PASSWORD
  GF_DATABASE_SSL_MODE: require
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: infra
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: REPLACE_GRAFANA_ADMIN_PASSWORD
